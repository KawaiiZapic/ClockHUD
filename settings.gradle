pluginManagement {
	repositories {
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		mavenCentral()
		gradlePluginPortal()
	}
}

rootProject.name = 'clock-hud'

def targets = new groovy.json.JsonSlurper().parse(file('versions.json'))
targets.each { target ->
    include "mc-${target.minecraft}"
    project(":mc-${target.minecraft}").projectDir = file("adapters/${target.minecraft}")
}
