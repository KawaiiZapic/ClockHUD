pluginManagement {
	repositories {
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		mavenCentral()
		gradlePluginPortal()
	}
}

rootProject.name = 'clock-hud'

def targets = new groovy.json.JsonSlurper().parse(file('adapters/fabric/versions.json'))
targets.each { target ->
    include "fabric-${target.minecraft}"
    project(":fabric-${target.minecraft}").projectDir = file("adapters/fabric/${target.minecraft}")
}
