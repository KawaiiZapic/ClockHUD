import groovy.json.JsonOutput
import groovy.json.JsonSlurper

plugins {
    id 'java-library'
    id 'fabric-loom' version '1.14.10' apply false
}

group = project.maven_group
version = project.mod_version

def targets = new JsonSlurper().parse(file('adapters/fabric/versions.json'))

java {
    sourceCompatibility = JavaVersion.VERSION_16
    targetCompatibility = JavaVersion.VERSION_16
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net/' }
    maven { url = 'https://maven.shedaniel.me/' }
}

dependencies {
    // Shared configuration uses AutoConfig's Minecraft-independent API.
    compileOnly('me.shedaniel.cloth:cloth-config-fabric:5.3.63') { transitive = false }
    compileOnly "net.fabricmc:fabric-loader:${project.loader_version}"
    compileOnly 'com.google.code.gson:gson:2.11.0'
    compileOnly 'org.slf4j:slf4j-api:1.7.36'
}

tasks.withType(JavaCompile).configureEach {
    options.release = 16
    options.encoding = 'UTF-8'
}

def metadataDir = layout.buildDirectory.dir('generated/resources')
def releaseMetadataDir = layout.buildDirectory.dir('generated/releaseResources')
def bundleMetadataDir = layout.buildDirectory.dir('generated/fabricAdapterBundle')
tasks.register('generateMetadata') {
    inputs.file('adapters/fabric/versions.json')
    inputs.file('src/main/resources/fabric.mod.json')
    inputs.file('adapters/fabric/resources/fabric.mod.json')
    inputs.property('version', project.version)
    outputs.dir(metadataDir)
    outputs.dir(releaseMetadataDir)
    outputs.dir(bundleMetadataDir)
    doLast {
        def template = file('src/main/resources/fabric.mod.json').getText('UTF-8')
                .replace('${version}', project.version.toString())
        def metadata = new JsonSlurper().parseText(template)
        metadata.jars = []
        def destination = metadataDir.get().file('fabric.mod.json').asFile
        destination.parentFile.mkdirs()
        destination.text = JsonOutput.prettyPrint(JsonOutput.toJson(metadata)) + '\n'
        metadata.jars = [[file: 'META-INF/jars/fabric-adapters.jar']]
        metadata.depends['clock-hud-fabric-adapters'] = "=${project.version}"
        def releaseDestination = releaseMetadataDir.get().file('fabric.mod.json').asFile
        releaseDestination.parentFile.mkdirs()
        releaseDestination.text = JsonOutput.prettyPrint(JsonOutput.toJson(metadata)) + '\n'
        def bundleTemplate = file('adapters/fabric/resources/fabric.mod.json').getText('UTF-8')
                .replace('${version}', project.version.toString())
        def bundleMetadata = new JsonSlurper().parseText(bundleTemplate)
        bundleMetadata.jars = targets.collect { [file: "META-INF/jars/adapter-${it.minecraft}.jar"] }
        def bundleDestination = bundleMetadataDir.get().file('fabric.mod.json').asFile
        bundleDestination.parentFile.mkdirs()
        bundleDestination.text = JsonOutput.prettyPrint(JsonOutput.toJson(bundleMetadata)) + '\n'
    }
}

sourceSets.main.resources.exclude 'fabric.mod.json'
processResources {
    dependsOn tasks.named('generateMetadata')
    from(metadataDir)
}

// Keep the compile dependency separate from the universal release to avoid
// a cycle between adapter compilation and assembly.
jar {
    archiveClassifier = 'core'
    destinationDirectory = layout.buildDirectory.dir('intermediates')
}

// Both inner layers are stored; the outer JAR compresses all adapters as one entry.
def fabricAdapterBundle = tasks.register('fabricAdapterBundle', Jar) {
    archiveFileName = 'fabric-adapters.jar'
    destinationDirectory = layout.buildDirectory.dir('intermediates')
    entryCompression = ZipEntryCompression.STORED
    dependsOn tasks.named('generateMetadata')
    from bundleMetadataDir
    duplicatesStrategy = DuplicatesStrategy.FAIL
    targets.each { target ->
        def adapter = project(":fabric-${target.minecraft}")
        dependsOn "${adapter.path}:storedJar"
        from({ adapter.tasks.named('storedJar').get().archiveFile }) {
            into 'META-INF/jars'
            rename { "adapter-${target.minecraft}.jar" }
        }
    }
}

tasks.register('universalJar', Jar) {
    archiveBaseName = project.archives_base_name
    from(sourceSets.main.output) {
        exclude 'fabric.mod.json'
    }
    dependsOn tasks.named('generateMetadata')
    from releaseMetadataDir
    from('LICENSE')
    duplicatesStrategy = DuplicatesStrategy.FAIL
    from(fabricAdapterBundle) {
        into 'META-INF/jars'
    }
}

assemble.dependsOn tasks.named('universalJar')
