import groovy.json.JsonSlurper

apply plugin: 'fabric-loom'

def target = new JsonSlurper().parse(rootProject.file('versions.json'))
        .find { "mc-${it.minecraft}" == project.name }

group = rootProject.group
version = rootProject.version
base.archivesName = "clock-hud-adapter-${target.minecraft}"

// One source copy, compiled with each adapter's own native types and mappings.
sourceSets.main.java.srcDir(rootProject.file('src/bridge/java'))

java {
    sourceCompatibility = JavaVersion.toVersion(target.java)
    targetCompatibility = JavaVersion.toVersion(target.java)
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.shedaniel.me/' }
    maven { url = 'https://api.modrinth.com/maven' }
}

dependencies {
    minecraft "com.mojang:minecraft:${target.minecraft}"
    mappings "net.fabricmc:yarn:${target.yarn}:v2"
    modImplementation "net.fabricmc:fabric-loader:${rootProject.loader_version}"
    modImplementation fabricApi.module('fabric-lifecycle-events-v1', target.fabric)
    modImplementation fabricApi.module('fabric-key-binding-api-v1', target.fabric)
    modRuntimeOnly(fabricApi.module(target.resource_loader, target.fabric)) {
        exclude group: 'net.fabricmc', module: 'fabric-loader'
    }
    modImplementation("me.shedaniel.cloth:cloth-config-fabric:${target.cloth}") {
        exclude group: 'net.fabricmc.fabric-api'
    }
    modCompileOnly "maven.modrinth:modmenu:${target.modmenu}"
    implementation project(':')
}

loom {
    mixin {
        useLegacyMixinAp = true
        defaultRefmapName = 'clock-hud-adapter-refmap.json'
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = target.java
    options.encoding = 'UTF-8'
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'loader_version', rootProject.loader_version
    filesMatching('fabric.mod.json') {
        expand version: project.version, loader_version: rootProject.loader_version
    }
}
